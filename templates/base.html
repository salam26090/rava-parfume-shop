<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rava Perfume Shop</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .perfume-card { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
        .perfume-card img { width: 100%; height: 250px; object-fit: cover; }
        .perfume-card p { padding: 10px; font-weight: bold; color: #555; margin: 0; }
    </style>
</head>
<body>
    <h1>🌹 Rava Perfume Shop 🌹</h1>
    
    {% if images %}
        <div class="gallery">
            {% for image in images %}
                <div class="perfume-card">
                    <img src="{{ url_for('static', filename='images/' + image) }}" alt="Perfume">
                    <p>{{ image.split('.')[0] }}</p>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p style="color:red; text-align:center;">⚠️ کوئی تصویر نہیں ملی۔</p>
    {% endif %}
</body>
</html>
