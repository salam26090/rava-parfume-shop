<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rava Perfume Shop{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        header { background-color: #333; color: white; padding: 20px; text-align: center; }
        footer { background-color: #333; color: white; padding: 10px; text-align: center; margin-top: 30px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .perfume-card { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
        .perfume-card img { width: 100%; height: 250px; object-fit: cover; }
        .perfume-card p { padding: 10px; font-weight: bold; color: #555; margin: 0; }
    </style>
</head>
<body>
    <header>
        <h1>🌹 Rava Perfume Shop 🌹</h1>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Rava Perfume Shop. All rights reserved.</p>
    </footer>
</body>
</html>
